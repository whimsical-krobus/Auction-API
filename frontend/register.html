<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrering</title>
  </head>
  <body>
    <div id="app">
      <h1>Registrering</h1>
      <form id="registerForm">
        <input type="text" id="username" placeholder="Användarnamn" required />
        <input type="email" id="email" placeholder="E-post" required />
        <input type="password" id="password" placeholder="Lösenord" required />
        <button>Registrera</button>
      </form>
      <p id="message"></p>
      <p>Har du redan ett konto? <a href="/login.html">Logga in</a></p>
    </div>
    <script type="module" src="/src/register.ts"></script>
  </body>
</html>
